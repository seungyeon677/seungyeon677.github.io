  <!-- Tab Controller & CV Date JS -->
  <script>
    const tabCache = {};
  
    // 1. 탭 외부 HTML 파일(tabs/OOO.html) 불러오기 함수
    async function loadTab(tabId) {
      const container = document.getElementById('tab-content');
      
      // 네비게이션 버튼 스타일 업데이트
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-accent', 'font-semibold', 'bg-paper-soft', 'border', 'border-hairline');
        btn.classList.add('text-ink-muted');
      });
      
      const activeBtn = document.getElementById('tab-btn-' + tabId);
      if (activeBtn) {
        activeBtn.classList.add('text-accent', 'font-semibold', 'bg-paper-soft', 'border', 'border-hairline');
        activeBtn.classList.remove('text-ink-muted');
      }
  
      // 캐시된 내용이 있으면 불러오고, 없으면 fetch로 가져오기
      if (tabCache[tabId]) {
        container.innerHTML = tabCache[tabId];
      } else {
        container.innerHTML = '<div class="text-center py-10 text-xs text-ink-muted">Loading content...</div>';
        try {
          const response = await fetch(`./tabs/${tabId}.html`);
          if (!response.ok) throw new Error('Tab file not found');
          const html = await response.text();
          tabCache[tabId] = html;
          container.innerHTML = html;
        } catch (error) {
          container.innerHTML = `<div class="p-4 text-xs text-red-500">Failed to load content for ${tabId}.</div>`;
        }
      }
  
      // CV 탭이 열릴 때 커밋 날짜 자동 반영 함수 실행
      if (tabId === 'cv') {
        updateCvDate();
      }
  
      // URL 해시 업데이트 (#about, #cv 등)
      history.pushState(null, null, '#' + tabId);
    }
  
    // 2. GitHub API를 통해 CV 파일의 최신 커밋 날짜 가져오기
    async function updateCvDate() {
      const username = 'seungyeon677';
      const repo = 'seungyeon677.github.io';
      const filePath = 'assets/pdf/CV_Seungyeon_Lee.pdf'; // 실제 깃허브 CV 파일 경로
  
      try {
        const response = await fetch(`https://api.github.com/repos/${username}/${repo}/commits?path=${filePath}&page=1&per_page=1`);
        
        if (!response.ok) throw new Error('Network response was not ok');
        
        const data = await response.json();
        if (data && data.length > 0) {
          const commitDate = new Date(data[0].commit.committer.date);
          
          // 날짜 포맷팅 (예: "August 2026")
          const formattedDate = commitDate.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long'
          });
          
          const dateElem = document.getElementById('cv-updated-date');
          if (dateElem) {
            dateElem.textContent = `Updated: ${formattedDate}`;
          }
        }
      } catch (error) {
        console.error('CV 날짜를 불러오는데 실패했습니다:', error);
        const dateElem = document.getElementById('cv-updated-date');
        if (dateElem) {
          dateElem.textContent = 'Updated: August 2026';
        }
      }
    }
  
    // 3. 페이지가 처음 로드될 때 실행
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash) {
        loadTab(hash);
      } else {
        loadTab('about');
      }
    });
  </script>
